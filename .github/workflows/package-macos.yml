name: Mac desktop download
on:
  push:
    branches: [main, build/platform-downloads]
    paths:
      - '.github/workflows/package-macos.yml'
      - 'lib/**'
      - 'pubspec.*'
      - 'assets/**'
      - 'macos/**'
      - '.github/scripts/check-db.py'
      - 'licenses/Lexend-OFL.txt'
  pull_request:
    branches: [main, build/platform-downloads]
    paths:
      - '.github/workflows/package-macos.yml'
      - 'lib/**'
      - 'pubspec.*'
      - 'assets/**'
      - 'macos/**'
      - '.github/scripts/check-db.py'
      - 'licenses/Lexend-OFL.txt'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

jobs:
  macos:
    name: Build the Mac desktop app
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.5'
          channel: stable
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Compile the release app
        run: flutter build macos --release --no-pub
      - name: Package the Mac download
        run: |
          app="build/macos/Build/Products/Release/Jot.app"
          test -x "$app/Contents/MacOS/Jot"
          for binary in "$app/Contents/MacOS/Jot" "$app/Contents/Frameworks/App.framework/App" "$app/Contents/Frameworks/FlutterMacOS.framework/FlutterMacOS"; do
            lipo -archs "$binary"
            lipo "$binary" -verify_arch arm64 x86_64
          done
          if ! codesign --verify --deep --strict "$app"; then
            codesign --force --deep --sign - --entitlements macos/Runner/Release.entitlements "$app"
          fi
          codesign --verify --deep --strict "$app"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/Jot-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Jot-macOS
          path: dist/Jot-macOS.zip
          if-no-files-found: error
          retention-days: 90

  smoke:
    name: Launch packaged desktop app on macos
    needs: macos
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: Jot-macOS
          path: downloads/Jot-macOS
      - name: Launch the Mac bundle and verify the database
        run: |
          ditto -x -k downloads/Jot-macOS/Jot-macOS.zip unpacked
          SCANNED=0
          while IFS= read -r binary; do
            if file -b "$binary" | grep -q 'Mach-O'; then
              lipo "$binary" -verify_arch x86_64 arm64
              SCANNED=$((SCANNED+1))
            fi
          done < <(find unpacked/Jot.app -type f)
          test "$SCANNED" -ge 3
          echo "Verified both architectures in $SCANNED Mach-O files"
          codesign --verify --deep --strict unpacked/Jot.app
          unpacked/Jot.app/Contents/MacOS/Jot > "$RUNNER_TEMP/jot-mac.log" 2>&1 &
          pid=$!
          trap 'cat "$RUNNER_TEMP/jot-mac.log"; kill "$pid" 2>/dev/null || true' EXIT
          python3 .github/scripts/check-db.py "$HOME/Library/Containers/au.com.asherpereira.jot"
          sleep 3
          kill -0 "$pid"
