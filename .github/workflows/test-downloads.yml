name: Exercise Jot downloads
on:
  push:
    branches: [build/platform-downloads]
    paths:
      - '.github/workflows/test-downloads.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  desktop:
    name: Launch packaged desktop app on ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: macos, runner: macos-15, artifact: Jot-macOS}
          - {platform: windows, runner: windows-2022, artifact: Jot-Windows-x64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download the matching desktop build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/get-package.sh ${{ matrix.artifact }} ${{ matrix.platform }} .github/workflows/package-${{ matrix.platform }}.yml
      - name: Launch the Mac bundle and verify the database
        if: runner.os == 'macOS'
        run: |
          ditto -x -k downloads/Jot-macOS/Jot-macOS.zip unpacked
          SCANNED=0
          while IFS= read -r binary; do
            if file -b "$binary" | grep -q 'Mach-O'; then
              lipo "$binary" -verify_arch x86_64 arm64
              SCANNED=$((SCANNED+1))
            fi
          done < <(find unpacked/Jot.app -type f)
          test "$SCANNED" -ge 3
          echo "Verified both architectures in $SCANNED Mach-O files"
          codesign --verify --deep --strict unpacked/Jot.app
          unpacked/Jot.app/Contents/MacOS/Jot > "$RUNNER_TEMP/jot-mac.log" 2>&1 &
          pid=$!
          trap 'cat "$RUNNER_TEMP/jot-mac.log"; kill "$pid" 2>/dev/null || true' EXIT
          python3 .github/scripts/check-db.py "$HOME/Library/Containers/au.com.asherpereira.jot"
          sleep 3
          kill -0 "$pid"
      - name: Launch Windows app from unpacked files and verify the database
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $path = (Resolve-Path 'downloads/Jot-Windows-x64').Path
          $process = Start-Process "$path/jot.exe" -WorkingDirectory $path -PassThru
          try {
            python .github/scripts/check-db.py "$env:APPDATA"
            if ($LASTEXITCODE) { throw 'Jot did not open its database' }
            Start-Sleep 3
            $process.Refresh()
            if ($process.HasExited -or !$process.MainWindowHandle) { throw 'Jot did not keep an open window' }
            Write-Output "Jot window: $($process.MainWindowTitle)"
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id }
          }

  apple_simulator:
    name: Launch packaged app in ${{ matrix.platform }} Simulator
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: iOS, artifact: Jot-iOS-Simulator}
          - {platform: watchOS, artifact: Jot-watchOS-Simulator}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download the simulator build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/get-package.sh ${{ matrix.artifact }} ios watchos .github/workflows/package-ios.yml
      - run: python3 .github/scripts/simulator-smoke.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Jot-smoke-${{ matrix.platform }}
          path: proof/
          if-no-files-found: ignore

  android_emulator:
    name: Exercise packaged APK on ${{ matrix.kind }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kind: phone, artifact: Jot-Android, image: google_apis, profile: pixel_6, api: 35}
          - {kind: wear, artifact: Jot-WearOS, image: android-wear, profile: wearos_large_round, api: 34}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download the APK built for this device
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/get-package.sh ${{ matrix.artifact }} android wearos .github/workflows/package-android.yml
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.image }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-boot-timeout: 600
          script: python3 .github/scripts/android-smoke.py ${{ matrix.kind }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Jot-smoke-Android-${{ matrix.kind }}
          path: proof/
          if-no-files-found: ignore
