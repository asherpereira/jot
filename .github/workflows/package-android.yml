name: Android and Wear OS downloads
on:
  push:
    branches: [main, build/platform-downloads]
    paths:
      - '.github/workflows/package-android.yml'
      - 'lib/**'
      - 'pubspec.*'
      - 'assets/**'
      - 'android/**'
      - 'wearos/**'
      - '.github/scripts/android-smoke.py'
      - 'licenses/Lexend-OFL.txt'
  pull_request:
    branches: [main, build/platform-downloads]
    paths:
      - '.github/workflows/package-android.yml'
      - 'lib/**'
      - 'pubspec.*'
      - 'assets/**'
      - 'android/**'
      - 'wearos/**'
      - '.github/scripts/android-smoke.py'
      - 'licenses/Lexend-OFL.txt'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_SUPPRESS_ANALYTICS: 'true'

jobs:
  android:
    name: Build the paired Android APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.5'
          channel: stable
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Select Java and prepare Gradle
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          mkdir -p "$HOME/.gradle" dist
          printf 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.workers.max=3\n' >> "$HOME/.gradle/gradle.properties"
      - name: Build Wear OS APK
        run: |
          ./wearos/gradlew -p wearos :app:assembleDebug --no-daemon
          cp wearos/app/build/outputs/apk/debug/app-debug.apk dist/Jot-WearOS.apk
      - name: Build Android phone and tablet APK
        run: |
          flutter build apk --release --no-pub
          cp build/app/outputs/flutter-apk/app-release.apk dist/Jot-Android.apk
      - name: Verify the phone and watch have matching signing certificates
        run: |
          tools=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for apk in dist/*.apk; do
            "$tools" verify --print-certs "$apk" > "$apk.cert"
            grep 'certificate SHA-256 digest:' "$apk.cert"
          done
          diff <(grep 'certificate SHA-256 digest:' dist/Jot-Android.apk.cert) <(grep 'certificate SHA-256 digest:' dist/Jot-WearOS.apk.cert)
      - uses: actions/upload-artifact@v4
        with:
          name: Jot-Android
          path: dist/Jot-Android.apk
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: Jot-WearOS
          path: dist/Jot-WearOS.apk
          if-no-files-found: error
          retention-days: 90

  android_emulator:
    needs: android
    name: Exercise packaged APK on ${{ matrix.kind }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - {kind: phone, artifact: Jot-Android, image: google_apis, profile: pixel_6, api: 35}
          - {kind: wear, artifact: Jot-WearOS, image: android-wear, profile: wearos_large_round, api: 34}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: downloads/${{ matrix.artifact }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.image }}
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-boot-timeout: 600
          script: python3 .github/scripts/android-smoke.py ${{ matrix.kind }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Jot-smoke-Android-${{ matrix.kind }}
          path: proof/
          if-no-files-found: ignore
